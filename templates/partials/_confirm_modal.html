<div class="modal fade lb-modal lb-confirm" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="lb-modal__body lb-confirm__body">
        <span class="lb-confirm__icon"><i class="bi bi-exclamation-diamond"></i></span>
        <p class="lb-modal__eyebrow">Confirmação</p>
        <h2 class="lb-modal__title" id="confirmTitle">Tem certeza?</h2>
        <p class="lb-confirm__message" id="confirmMessage">Esta ação não pode ser desfeita.</p>
        <div class="lb-confirm__actions">
          <button type="button" class="lb-btn lb-btn--quiet" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="lb-btn lb-btn--danger" id="confirmAccept">Sim, continuar</button>
        </div>
      </div>
    </div>
  </div>
</div>
